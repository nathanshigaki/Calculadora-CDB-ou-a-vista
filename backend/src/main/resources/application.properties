server.port=8080
spring.application.name=calculadora-cdb-avista

# Spring AI OpenAI configuration targeting Gemini's OpenAI-compatible v1beta API
spring.ai.openai.api-key=${GEMINI_API_KEY:gemini-placeholder-key}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=gemini-1.5-flash
spring.ai.openai.chat.options.temperature=0.3

# Default financial benchmarks (Brasil)
app.financial.default-selic=11.25
app.financial.default-cdb-percent=105.0
