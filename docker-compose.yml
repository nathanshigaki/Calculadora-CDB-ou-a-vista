services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calculadora-backend
    ports:
      - "8080:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-gemini-placeholder-key}
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - calculadora-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: calculadora-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - calculadora-network
    restart: unless-stopped

networks:
  calculadora-network:
    driver: bridge
